
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px auto;
            padding: 20px;
            max-width: 600px;
            line-height: 1.6;
            background-color: #f4f6f9;
            color: #333;
        }

        h1, h2 {
            color: #2457a7;
        }

        .section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 10px 16px;
            background-color: #2457a7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #173e7c;
        }

        input {
            padding: 10px;
            width: 90%;
            max-width: 350px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }

        #result, #greeting {
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <h1>Student API Interface</h1>

    <!-- Student Information Section -->
    <div class="section">
        <h2>Student Information</h2>

        <button onclick="loadStudent()">
            Load Student Information
        </button>

        <div id="result"></div>
    </div>

    <hr>

    <!-- Greeting API Section -->
    <div class="section">
        <h2>Greeting API</h2>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your first name"
        >

        <br>

        <button onclick="sayHello()">Say Hello</button>

        <p id="greeting"></p>
    </div>

    <script>
        // Load student information from Flask API
        async function loadStudent() {
            const result = document.getElementById("result");

            result.textContent = "Loading student information...";

            try {
                const response = await fetch("/student");

                if (!response.ok) {
                    throw new Error("Failed to fetch student data");
                }

                const data = await response.json();

                result.replaceChildren();

                const fields = [
                    ["Student ID", data.student_id],
                    ["Name", data.name],
                    ["Program", data.program],
                    ["Year", data.year],
                    ["Section", data.section]
                ];

                fields.forEach(([label, value]) => {
                    const p = document.createElement("p");
                    const bold = document.createElement("b");

                    bold.textContent = label + ": ";
                    p.appendChild(bold);
                    p.appendChild(
                        document.createTextNode(value ?? "N/A")
                    );

                    result.appendChild(p);
                });

            } catch (error) {
                console.error("Student API error:", error);
                result.textContent =
                    "Unable to retrieve student data. Please try again.";
            }
        }

        // Get greeting from Flask API
        async function sayHello() {
            const name = document
                .getElementById("nameInput")
                .value.trim();

            const greeting = document.getElementById("greeting");

            if (!name) {
                greeting.textContent =
                    "Please enter your first name.";
                return;
            }

            greeting.textContent = "Loading greeting...";

            try {
                const response = await fetch(
                    `/hello?name=${encodeURIComponent(name)}`
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch greeting");
                }

                const data = await response.json();

                greeting.textContent = data.message;

            } catch (error) {
                console.error("Greeting API error:", error);
                greeting.textContent =
                    "Unable to retrieve greeting. Please try again.";
            }
        }
    </script>
</body>
</html>
